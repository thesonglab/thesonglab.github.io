# the brain lab — Homepage Content

# head meta
head:
  title: "Song Lab"

# showcase / hero (split-panel layout)
showcase:
  enable: true
  # Big wordmark shown top-left of the hero
  wordmark: "thebrainlab"
  welcome: "Welcome to the Brain Lab! We conduct naturalistic cognitive computational neuroscience research at UT Austin."
  description: >
    Our lab operates under deep curiosity for the human beings, what makes us special and what makes us who we are. We study mechanisms of the human brain, and how neural systems and dynamics give rise to cognitive experiences. We conduct functional magnetic resonance imaging and behavioral experiments to examine brain activity in relation to behavior. We develop artificial neural network models, simulating brain circuits and functions, to understand the brain's computational principles.
  launch: >
    The lab is launching at the
  launchLink:
    text: "University of Texas at Austin"
    URL: "https://liberalarts.utexas.edu/psychology/"
  launchSuffix: ", in August 2026! Please visit"
  joinLink:
    text: "Join Us"
    URL: "/joinus/"
  joinSuffix: " if you are interested in becoming the founding members of the lab."

# about / research
about:
  enable: true
  title: "Our Research"
  content: '<p class="lead">
    The Song Lab investigates the neural computations that support how we see, remember, and make
    decisions. We are particularly interested in how different brain regions communicate and
    coordinate to give rise to flexible, context-dependent behavior.
    </p>
    <p class="lead">
    Our work integrates large-scale neural recordings, human neuroimaging (fMRI / EEG), and
    computational models to bridge the gap between neural activity and cognition.
    We welcome collaborations and are always looking for motivated students and postdocs.
    </p>'
  button:
    icon: "icon-profile-fill"
    btnText: "PI Profile"
    URL: "#"   # update with link to PI page or CV

  image:
    x: "img/who-am-i/user-picture.png"
    _2x: "img/who-am-i/user-picture@2x.png"

